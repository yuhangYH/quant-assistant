<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quant Assistant</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e4e4e0;
    --accent: #16624a;
    --accent-soft: #e7f0ec;
    --user: #edeef0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --panel: #1c1e24;
      --ink: #ecedef;
      --muted: #9aa0aa;
      --line: #2b2e36;
      --accent: #5fd0a6;
      --accent-soft: #17342a;
      --user: #262932;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 22px 4px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 14px; border-radius: 12px; max-width: 90%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.bot { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; }
  .msg.bot.think { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent);
          border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  form { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 18px; border-top: 1px solid var(--line);
         display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
                     background: var(--panel); color: var(--ink); font-size: 15px; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 18px;
                font-size: 15px; cursor: pointer; }
  button.send:disabled { opacity: 0.5; cursor: default; }
  footer { color: var(--muted); font-size: 12px; padding: 4px 4px 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span>Quant</span> Assistant</h1>
      <div class="sub">Claude-powered RAG + tool-calling research assistant. Answers are grounded in indexed notes and data.</div>
    </header>
    <main id="log">
      <div class="msg bot">Ask a question about the indexed research notes or the sample dataset. Try one of these:</div>
      <div class="chips" id="chips"></div>
    </main>
    <form id="form">
      <input type="text" id="q" autocomplete="off" placeholder="Ask about the data or the notes…" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
    <footer>Independent project by Yuhang Guo. Sample data is synthetic and for demonstration only.</footer>
  </div>

<script>
  const THINKING = "Thinking and calling tools…";
  const ERR = "Something went wrong. Is the server running and the index built?";
  const CHIPS = [
    "How volatile has ACME been recently?",
    "What do the notes say about momentum vs mean reversion?",
    "Summarize a backtest for these monthly returns: 0.02, -0.01, 0.03, 0.00, -0.02, 0.04",
  ];
  const $ = (id) => document.getElementById(id);

  (function renderChips() {
    const chips = $("chips");
    CHIPS.forEach((c) => {
      const el = document.createElement("button");
      el.type = "button"; el.className = "chip"; el.textContent = c;
      el.onclick = () => { $("q").value = c; $("q").focus(); };
      chips.appendChild(el);
    });
  })();

  function addMsg(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    $("log").appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
    return el;
  }

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    addMsg(q, "user");
    $("q").value = "";
    $("send").disabled = true;
    const thinking = addMsg(THINKING, "bot think");
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      const data = await res.json();
      thinking.remove();
      addMsg(res.ok ? data.answer : (data.detail || ERR), "bot");
    } catch (err) {
      thinking.remove();
      addMsg(ERR, "bot");
    } finally {
      $("send").disabled = false;
      $("q").focus();
    }
  };
</script>
</body>
</html>
